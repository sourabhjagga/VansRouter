name: Soak Timer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 3000  # 50 hours max
    steps:
      - name: Check for soak-48h label on latest commit
        id: label
        run: |
          set -euo pipefail
          # Check if the latest commit on main has the soak-48h label
          if gh api repos/${{ github.repository }}/commits/main/labels --jq '.[] | select(.name=="soak-48h")' | grep -q soak-48h; then
            echo "label_found=true" >> "$GITHUB_OUTPUT"
            echo "48h soak label found on latest commit"
          else
            echo "label_found=false" >> "$GITHUB_OUTPUT"
            echo "No soak-48h label on latest commit, exiting"
            exit 0
          fi

      - name: Wait 48 hours after label
        if: steps.label.outputs.label_found == 'true'
        run: |
          echo "Starting 48h soak..."
          sleep 172800  # 48 hours
          echo "Soak complete"

      - name: Dispatch Deploy & Verify
        if: steps.label.outputs.label_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-verify.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy & Verify dispatched"

      - name: Remove soak label
        if: steps.label.outputs.label_found == 'true'
        run: gh api repos/${{ github.repository }}/commits/main/labels -X DELETE -f name=soak-48h || true

